version: 1.0.0+1

environment:
  sdk: ^3.9.2

# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  animations: ^2.1.0
  url_launcher: ^6.3.2 #For launching url to open MetaMask wallet App
  reown_walletkit: ^1.3.5 #For metamask wallet connectư
  equatable: ^2.0.7 #For comparing objects
  flutter_bloc: ^9.1.1 #For managing different states
  get_it: ^8.2.0 #Accessing service objects
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  go_router: ^16.3.0
  shared_preferences: ^2.5.3
  # vibration: ^3.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


